[project]
name = "automotive-arbitrage"
version = "0.1.0"
description = "Germany to Ukraine automotive arbitrage backend"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2.0",
    "pydantic-settings>=2.2,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "SQLAlchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.6,<1.0", "mypy>=1.11,<2.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

